name: Publish claims source

on:
  push:
    branches: [main]
    paths:
      - .sync/claims/**
      - .github/workflows/publish-claims-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact source
        run: |
          test -f .sync/claims/00.part || exit 0
          cat .sync/claims/00.part .sync/claims/01.part .sync/claims/02.part .sync/claims/03.part > src/modules/insurance/InsuranceClaimsLiability8.lua
          ACTUAL=$(git hash-object src/modules/insurance/InsuranceClaimsLiability8.lua)
          EXPECTED=09f7b7cb3aa3dc9af50b82d14ec2f8cac0d57b69
          echo "claims blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit exact source and clean staging chunks
        run: |
          test -f .sync/claims/00.part || exit 0
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add src/modules/insurance/InsuranceClaimsLiability8.lua
          git rm -r .sync/claims
          git commit -m "Publish exact insurance claims liability source"
          git push
