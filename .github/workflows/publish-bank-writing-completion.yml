name: Publish exact bank writing completion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-bank-writing-completion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact source
        run: |
          mkdir -p src/modules/bank
          cat .github/sync/bank_plain/part00.lua.txt \
              .github/sync/bank_plain/part01.lua.txt \
              .github/sync/bank_plain/part02.lua.txt \
              .github/sync/bank_plain/part03.lua.txt \
              .github/sync/bank_plain/part04.lua.txt \
              .github/sync/bank_plain/part05.lua.txt \
              .github/sync/bank_plain/part06.lua.txt \
              > src/modules/bank/BankRoadmap3Completion.lua
          echo "9cba9fef0d0fd8e6ed7ed4f7a98d19bee1c20b153569b92614cf4161d2ec2225  src/modules/bank/BankRoadmap3Completion.lua" | sha256sum -c -
          rm -rf .github/sync/bank_plain .github/sync/bank_completion
          rm -f .github/workflows/publish-bank-writing-completion.yml
      - name: Commit exact source and clean staging
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add -A src/modules/bank/BankRoadmap3Completion.lua .github/sync .github/workflows/publish-bank-writing-completion.yml
          git commit -m "Publish exact bank roadmap writing completion"
          git push
