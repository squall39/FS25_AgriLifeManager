name: Apply AgriLife 0.9.3 exact source sync

on:
  push:
    branches: [main]
    paths:
      - tools/sync093_exact_ready.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand exact 0.9.3 text sources
        run: python3 tools/apply_093_exact_sync.py

      - name: Run static gates
        run: |
          python3 tools/verify_release.py
          python3 tools/audit_l10n_usage.py
          python3 tools/audit_publication.py
          python3 tools/audit_roadmap_writing_completion.py
          python3 tools/audit_workshop81_closure.py
          python3 tools/audit_093_systems.py

      - name: Remove transfer helpers and dead truck leftovers
        run: |
          rm -rf tools/sync093_exact_payload tools/sync093_text_payload tools/overlay_092_payload tools/overlay_093_payload
          rm -f tools/sync093_exact_ready.txt tools/sync093_text_ready.txt
          rm -f tools/apply_093_exact_sync.py tools/apply_093_text_sync.py tools/apply_092_overlay_runner.py tools/apply_093_overlay_runner.py
          rm -f .github/workflows/apply-093-exact-sync.yml .github/workflows/apply-093-text-sync.yml .github/workflows/apply-092-overlay.yml .github/workflows/apply-093-overlay.yml
          rm -rf vehicles/serviceTruck
          rm -f vehicles/ServiceTruck6.lua gui/ServiceTruckDialog.xml gui/ServiceTruckDiscoveryDialog.xml
          rm -f gui/icons/service_truck.dds gui/icons/service_truck.png gui/icons/brand_gmc.dds gui/icons/brand_gmc.png

      - name: Commit synchronized 0.9.3 sources
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Synchronize AgriLife 0.9.3.0 TEST sources"
          git push origin HEAD:main
