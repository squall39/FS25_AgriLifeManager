name: Sync career service 0.9.3.26

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-career-service-09326.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Career6Service source
        env:
          CAREER_SOURCE_GZ_B64: ""
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ['CAREER_SOURCE_GZ_B64']))
          path = Path('src/modules/career/Career6Service.lua')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          PY
      - name: Commit source
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add src/modules/career/Career6Service.lua
          git diff --cached --quiet || git commit -m "Restore Career XP service 0.9.3.26"
          git push origin HEAD:main
