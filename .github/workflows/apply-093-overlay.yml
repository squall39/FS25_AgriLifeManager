name: Apply AgriLife 0.9.3.0 source overlay

on:
  push:
    branches: [main]
    paths:
      - tools/overlay_093_ready.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand exact 0.9.3.0 overlay
        run: python3 tools/apply_093_overlay_runner.py
      - name: Run static closure gates
        run: |
          python3 tools/verify_release.py
          python3 tools/audit_l10n_usage.py
          python3 tools/audit_publication.py
          python3 tools/audit_roadmap_writing_completion.py
          python3 tools/audit_workshop81_closure.py
          python3 tools/audit_093_systems.py
      - name: Remove transfer helpers
        run: |
          rm -rf tools/overlay_093_code tools/overlay_093_l10n tools/overlay_092_payload
          rm -f tools/overlay_093_ready.txt tools/apply_093_overlay_runner.py tools/apply_092_overlay_runner.py
          rm -f .github/workflows/apply-093-overlay.yml .github/workflows/apply-092-overlay.yml
      - name: Commit synchronized 0.9.3.0 source
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Synchronize AgriLife 0.9.3.0 TEST"
          git push origin HEAD:main
