name: Publish exact 0.9.1.0 modDesc

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-moddesc-091-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify exact modDesc
        run: |
          cat .github/sync/moddesc091/part00.txt .github/sync/moddesc091/part01.txt > modDesc.xml
          python - <<'PY'
          from pathlib import Path
          path = Path('modDesc.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<text name="action_hideMarkers"><en>Close service doors</en>', '<text name="action_hideMarkers"><en>Hide workshop markers</en>', 1)
          path.write_text(text, encoding='utf-8')
          PY
          echo "2567145943d944953c9ee7b5f0fc7eba0de689e451543563a650f1c50c2ada6a  modDesc.xml" | sha256sum -c -
          rm -rf .github/sync/moddesc091
          rm -f .github/workflows/sync-moddesc-091-exact.yml
          rm -f .github/workflows/publish-moddesc-091-exact.yml
      - name: Commit exact modDesc and clean staging
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add -A modDesc.xml .github/sync/moddesc091 .github/workflows/sync-moddesc-091-exact.yml .github/workflows/publish-moddesc-091-exact.yml
          git commit -m "Publish exact complete 0.9.1.0 modDesc"
          git push
