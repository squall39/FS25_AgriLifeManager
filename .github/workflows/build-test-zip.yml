name: Build AgriLife TEST ZIP

on:
  push:
    paths:
      - '.github/workflows/build-test-zip.yml'
      - '.github/AGRILIFE_BUILD_REQUEST'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download last complete player package base
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/squall39/FS25_AgriLifeManager/releases/download/0.6.4.32/FS25_AgriLifeManager.zip' \
            --output /tmp/agrilife-base.zip
          mkdir -p /tmp/agrilife-package
          unzip -q /tmp/agrilife-base.zip -d /tmp/agrilife-package

      - name: Overlay current 0.9.1.0 maintained source
        run: |
          mkdir -p /tmp/agrilife-package/src
          cp -a src/. /tmp/agrilife-package/src/
          cp modDesc.xml /tmp/agrilife-package/modDesc.xml
          if [ -d translations ]; then
            mkdir -p /tmp/agrilife-package/translations
            cp -a translations/. /tmp/agrilife-package/translations/
          fi
          if [ -d data ]; then
            mkdir -p /tmp/agrilife-package/data
            cp -a data/. /tmp/agrilife-package/data/
          fi
          if [ -d gui ]; then
            mkdir -p /tmp/agrilife-package/gui
            cp -a gui/. /tmp/agrilife-package/gui/
          fi
          if [ -d vehicles ]; then
            mkdir -p /tmp/agrilife-package/vehicles
            cp -a vehicles/. /tmp/agrilife-package/vehicles/
          fi
          if [ -d placeables ]; then
            mkdir -p /tmp/agrilife-package/placeables
            cp -a placeables/. /tmp/agrilife-package/placeables/
          fi
          cp ROADMAP.md /tmp/agrilife-package/ROADMAP.md

      - name: Restore active sources from Git history when needed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          repo = Path.cwd()
          package = Path('/tmp/agrilife-package')
          tree = ET.parse(package / 'modDesc.xml')
          restored = []
          unresolved = []

          for node in tree.findall('.//sourceFile'):
              rel = node.attrib.get('filename')
              if not rel:
                  continue
              target = package / rel
              if target.is_file():
                  continue

              proc = subprocess.run(
                  ['git', 'log', '--all', '-1', '--format=%H', '--', rel],
                  cwd=repo,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              commit = proc.stdout.strip()
              if not commit:
                  unresolved.append(rel)
                  continue

              blob = subprocess.run(
                  ['git', 'show', f'{commit}:{rel}'],
                  cwd=repo,
                  capture_output=True,
                  check=False,
              )
              if blob.returncode != 0:
                  unresolved.append(rel)
                  continue

              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(blob.stdout)
              restored.append((rel, commit[:10]))

          for rel, commit in restored:
              print(f'RESTORED {rel} from {commit}')
          print(f'RESTORED_COUNT={len(restored)}')
          if unresolved:
              raise SystemExit('Unresolved active sources: ' + ', '.join(unresolved))
          PY

      - name: Restore newest historical translations when available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          repo = Path.cwd()
          package = Path('/tmp/agrilife-package')
          paths = subprocess.run(
              ['git', 'log', '--all', '--name-only', '--pretty=format:', '--', 'translations'],
              cwd=repo,
              text=True,
              capture_output=True,
              check=False,
          ).stdout.splitlines()
          paths = sorted({p.strip() for p in paths if p.strip().startswith('translations/translation_') and p.strip().endswith('.xml')})
          restored = 0
          for rel in paths:
              commit = subprocess.run(
                  ['git', 'log', '--all', '-1', '--format=%H', '--', rel],
                  cwd=repo,
                  text=True,
                  capture_output=True,
                  check=False,
              ).stdout.strip()
              if not commit:
                  continue
              blob = subprocess.run(['git', 'show', f'{commit}:{rel}'], cwd=repo, capture_output=True, check=False)
              if blob.returncode != 0:
                  continue
              target = package / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(blob.stdout)
              restored += 1
          print(f'HISTORICAL_TRANSLATIONS_RESTORED={restored}')
          PY

      - name: Validate packaged player files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('/tmp/agrilife-package')
          tree = ET.parse(root / 'modDesc.xml')
          missing = []
          for node in tree.findall('.//sourceFile'):
              filename = node.attrib.get('filename')
              if filename and not (root / filename).is_file():
                  missing.append(filename)
          if missing:
              raise SystemExit('Missing source files: ' + ', '.join(missing))
          version = tree.getroot().findtext('version')
          if version != '0.9.1.0':
              raise SystemExit(f'Unexpected version: {version}')
          l10n = tree.getroot().find('l10n')
          if l10n is not None:
              prefix = l10n.attrib.get('filenamePrefix')
              if prefix and not any((root / 'translations').glob('translation_*.xml')):
                  raise SystemExit('Player translations are missing from package')
          if not (root / 'icon.dds').is_file():
              raise SystemExit('icon.dds missing from player package')
          print(f'PACKAGE VALIDATION: OK - version={version}')
          PY

      - name: Create player ZIP
        run: |
          cd /tmp/agrilife-package
          zip -q -r -9 "$GITHUB_WORKSPACE/FS25_AgriLifeManager.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum FS25_AgriLifeManager.zip
          unzip -tq FS25_AgriLifeManager.zip

      - name: Upload TEST ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FS25_AgriLifeManager-0.9.1.0-TEST
          path: FS25_AgriLifeManager.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
