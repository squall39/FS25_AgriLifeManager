name: F02 dashboard sync 0.9.3.22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f02-sync-09322.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic F02 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path, marker, section):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  p.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')

