          roadmap_section = '''
## Correction F02 0.9.3.19 - lisibilité des modules

- Entreprise : les vues Dossier salarié, Planning, Formations, Carrière salarié et Incidents sont affichées comme onglets directs.
- Contrats & Marchés : les données sont présentées avec des libellés explicites et un mode d'emploi visible.
- Atelier : les six vues deviennent des onglets directs et chaque vue reçoit un pictogramme HUD cohérent.
- La phase F02 reste active jusqu'à validation en jeu de cette correction.

## Correction F02 0.9.3.20 - compréhension marché et boutons Atelier

- Contrats & Marchés conserve les commandes Acheter, Vendre, Louer et Résilier location.
- Acheter/Vendre correspond aux opérations directes sur le marché sélectionné.
- Louer/Résilier correspond aux locations de champs ou productions lorsque la vue concernée les autorise.
- Négocier/Signer reste réservé au contrat commercial avec volume, durée, prix, qualité et pénalités.
- Les boutons d'action Atelier sans action disponible sont masqués au lieu d'apparaître comme des boutons vides.
- F02 reste à certifier en jeu après ce correctif.

## Correction F02 0.9.3.21 - texture HUD optimisée

- Interface F02 conservée telle que validée visuellement pour le moment.
- Correction du warning de performance FS25 sur `gui/icons/status_good.dds`.
- Texture `status_good.dds` compressée en DXT5 avec transparence conservée.

## Correction F02 0.9.3.22 - tableau de bord et carte Banque

- L'aide contextuelle supérieure du tableau de bord dispose de davantage de largeur et de contraste.
- La carte Banque est réalignée sur la grille des autres cartes.
- Le nom de la banque et le nom du conseiller sont affichés sur deux lignes distinctes.
- Le score de crédit contient uniquement sa valeur et son appréciation, sans nom de banque.
- F02 reste active jusqu'à validation dans Farming Simulator 25.
'''
