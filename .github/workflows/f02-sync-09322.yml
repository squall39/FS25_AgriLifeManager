        setText(self.dashBankAdvisorStars, string.format("Conseiller  RÉP %s  |  COMP %s", formatFiveStars(bankSnapshot.advisorReputationStars or bankSnapshot.advisorStars or 0), formatFiveStars(bankSnapshot.advisorCompetenceStars or bankSnapshot.advisorStars or 0)))''', 'home bank identity')
          replace_once(home, '''        local bank = cards.bank or {}
