name: Sync validated AgriLife ideas

on:
  push:
    branches: [main]
    paths:
      - tools/sync_validated_ideas.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated ideas sync
        run: python3 tools/sync_validated_ideas.py

      - name: Commit synchronized project state
        run: |
          if git diff --quiet; then
            echo "No synchronization changes required"
            exit 0
          fi
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add ROADMAP.md docs/ROADMAP.md docs/USER_GUIDE.md docs/IMPLEMENTATION_MATRIX.md docs/SOURCE_SYNC_MANIFEST.md docs/L10N_AUDIT.md CHANGELOG.md
          git commit -m "Synchronize validated AgriLife ideas"
          git push origin HEAD:main
