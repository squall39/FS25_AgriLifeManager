name: Sync exact 0.9.1.0 roadmap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-roadmap-091-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch roadmap statuses without deleting validated ideas
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          old_top = '> **État code 0.9.0.0 TEST :** les étapes 4 Entreprise, 5 Carrière & Qualifications, 6 Administration, 7 Contrats & Marchés, 8 Atelier et 9 Finalisation sont écrites et intégrées côté code. La certification FS25 réelle et les points historiques encore ouverts des étapes 1 à 3 restent distincts de cet état d\'écriture.'
          new_top = '> **État code 0.9.1.0 TEST :** les neuf étapes de la feuille de route ont désormais leur écriture fonctionnelle intégrée. La passe 0.9.1.0 ferme les derniers reliquats Démarrage / Interface / Banque avec comptabilité avancée, fiscalité, amortissements, bilan, capacité d’autofinancement, historique filtrable, relation bancaire enrichie et politique responsive. Les cases qui restent ouvertes ci-dessous correspondent à des certifications en jeu, relectures visuelles, compatibilités réelles ou validations de publication, pas à un script métier manquant.'
          if old_top not in text:
              raise SystemExit('Top 0.9.0.0 state not found')
          text = text.replace(old_top, new_top, 1)

          inserts = [
              ('# 1 - Démarrage\n\n', '> **Écriture 0.9.1.0 : terminée.** Les trois difficultés, leur permanence, les capitaux, les obligations Banque/Conseiller/Permis, le permis provisoire Normal, l’amende personnelle, le verrou véhicule Difficile, l’onboarding différé, la migration et l’isolation de carrière possèdent leur logique. Les cases encore ouvertes dans cette étape sont des scénarios à revalider dans FS25.\n\n'),
              ('# 2 - Interface & expérience utilisateur\n\n', '> **Écriture 0.9.1.0 : terminée.** Les six cartes, les états de permis par difficulté, le résultat/historique d’examen, le journal, les vues marchés/contrats/locations, le tutoriel paginé, le grisage des onglets indisponibles et une politique responsive 1080p/1440p/4K sont intégrés. Les cases d’affichage restant ouvertes servent à la certification visuelle réelle sur les résolutions ciblées.\n\n'),
              ('# 3 - Module Banque\n\n', '> **Écriture 0.9.1.0 : terminée.** Le module couvre désormais relation bancaire durable, consultation/offres, profils de risque, conseiller compatible, financement influencé par difficulté et marchés, refinancement, historique professionnel filtrable, catégorisation comptable, amortissements, compte de résultat, bilan, fiscalité, capacité d’autofinancement, séparation pro/perso et rentabilité par activité. Les actions crédit vanilla sont déjà interceptées. Les cases encore ouvertes ci-dessous doivent être lues comme validations terrain/UI à effectuer, pas comme fonctions absentes.\n\n'),
          ]
          for anchor, paragraph in inserts:
              if paragraph.strip() in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'Roadmap insertion anchor missing: {anchor.strip()}')
              text = text.replace(anchor, anchor + paragraph, 1)

          old_step9 = '> **État code 0.9.0.0 TEST :** l\'infrastructure prévue pour l\'étape 9 est écrite et intégrée : compatibilités optionnelles et fallback, découverte universelle, schéma de sauvegarde 4, migration 3 vers 4, identité de carrière, récupération backup, audit de persistance, isolation multi-fermes, squelette réseau serveur autoritaire, tutoriel paginé rebasé, audits l10n/publication, glossaire, documentation et packaging TEST/PUBLIC. Le multijoueur reste volontairement non publié et toutes les cases exigeant une vraie campagne FS25 restent ouvertes jusqu\'à certification.'
          new_step9 = '> **État code 0.9.1.0 TEST :** l\'infrastructure prévue pour l\'étape 9 est écrite et intégrée : compatibilités optionnelles et fallback, découverte universelle, schéma de sauvegarde 4, migration 3 vers 4, identité de carrière, récupération backup, audit de persistance, isolation multi-fermes, squelette réseau serveur autoritaire, tutoriel paginé rebasé, audits l10n/publication, glossaire, documentation et packaging TEST/PUBLIC. Le multijoueur reste volontairement non publié et toutes les cases exigeant une vraie campagne FS25 restent ouvertes jusqu\'à certification.'
          if old_step9 not in text:
              raise SystemExit('Step 9 0.9.0.0 state not found')
          text = text.replace(old_step9, new_step9, 1)
          path.write_text(text, encoding='utf-8')
          PY
          echo "fff56d09417828cbf499f9dc749da5747f754f38d91aad1673b67bb32bd00ac5  ROADMAP.md" | sha256sum -c -
          rm -f .github/workflows/sync-roadmap-091-exact.yml
      - name: Commit exact roadmap
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/sync-roadmap-091-exact.yml
          git commit -m "Synchronize complete 0.9.1.0 roadmap"
          git push
