name: Refresh 0.9.3.1 build label
on:
  push:
    branches: [ main ]
    paths:
      - '.github/sync/REFRESH_0931_BUILD'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh and self-clean
        run: |
          sed -i 's/Overlay current 0\.9\.1\.0 maintained source/Overlay current 0.9.3.1 maintained source/' .github/workflows/build-test-zip.yml
          rm -f .github/sync/REFRESH_0931_BUILD
          rm -f .github/workflows/refresh-0931-build-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh AgriLife 0.9.3.1 build workflow wording'
          git push origin HEAD:main
