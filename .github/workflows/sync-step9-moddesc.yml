name: Sync Step 9 modDesc

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-step9-moddesc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Step 9 version and active sources
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('modDesc.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<version>0.8.1.0</version>', '<version>0.9.0.0</version>')
          insertions = [
              ('        <sourceFile filename="src/core/AgriLifePersistence.lua" />\n', '        <sourceFile filename="src/core/AgriLifePersistence.lua" />\n        <sourceFile filename="src/core/AgriLifeNetworkRoadmap9.lua" />\n'),
              ('        <sourceFile filename="src/modules/compatibility/CompatibilityRoadmap8.lua" />\n', '        <sourceFile filename="src/modules/compatibility/CompatibilityRoadmap8.lua" />\n        <sourceFile filename="src/modules/compatibility/CompatibilityRoadmap9.lua" />\n'),
              ('        <sourceFile filename="src/modules/finalization/FinalizationModule.lua" />\n', '        <sourceFile filename="src/modules/finalization/FinalizationModule.lua" />\n        <sourceFile filename="src/modules/finalization/FinalizationRoadmap9.lua" />\n'),
          ]
          for needle, replacement in insertions:
              new_line = replacement.splitlines()[-1].strip()
              if new_line not in text:
                  if needle not in text:
                      raise SystemExit(f'Insertion anchor missing: {needle.strip()}')
                  text = text.replace(needle, replacement, 1)
          if '<multiplayer supported="false" />' not in text:
              raise SystemExit('Multiplayer publication gate unexpectedly changed')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized modDesc
        run: |
          if git diff --quiet -- modDesc.xml; then exit 0; fi
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add modDesc.xml
          git commit -m "Synchronize Step 9 modDesc"
          git push
