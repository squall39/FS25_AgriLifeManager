name: Sync F03 roadmap 0.9.3.24

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-roadmap-f03-09324.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prep = '''> **Préparation F03 0.9.3.24 :** audit statique ciblé avant opérations financières. Correction du capital/mois restants utilisés par l’interface, du remboursement anticipé à 10 %, du réaménagement +12 mois, conservation des frais liés à la banque d’origine du prêt, ajout de confirmations avant actions engageantes y compris le paiement fiscal, localisation des retours Banque et fermeture du découvert jusque-là seulement descriptif. Le découvert suit maintenant le solde professionnel négatif réel, peut couvrir les échéances et frais automatiques dans la limite autorisée, se rembourse automatiquement avec les crédits futurs, produit des intérêts mensuels selon la banque et entre dans la dette/capacité bancaire. La certification réelle reste ouverte jusqu’au test FS25.
- Le rattrapage bancaire traite désormais toutes les périodes manquées après une longue reprise de sauvegarde, sans sauter silencieusement les mensualités au-delà de 12 mois.
- Les frais de dossier d’un nouveau crédit et d’un refinancement respectent désormais les fonds professionnels autorisés, avec annulation propre de la création du prêt si le débit sécurisé échoue.
- Un ancien prêt actif ne bloque plus un changement de banque autorisé : il reste rattaché à sa banque d’origine et continue à y être remboursé. Le découvert et les frais/intérêts du compte courant doivent en revanche être soldés avant le changement.
- Le refinancement est évalué sur une capacité de remplacement qui retire virtuellement l’ancien prêt avant de mesurer le nouveau dossier, afin de ne pas traiter le refinancement comme une dette additionnelle.
- Le renouvellement du contrat bancaire est transactionnel : si la nouvelle signature échoue, le statut, l’échéance et le compteur de renouvellements précédents sont restaurés.
- Le découvert n'est plus permanent : toute autorisation possède une durée, des frais et une échéance. À défaut de régularisation, AgriLife enchaîne délai de régularisation, mise en demeure puis contentieux Juridique avec conséquences bancaires réelles.
'''

          overdraft = '''## Découvert professionnel temporaire et recouvrement

- [x] Remplacer le plafond de découvert permanent par une autorisation bancaire à durée déterminée.
- [x] Autorisations de 3, 6 ou 12 mois selon l'offre choisie et les limites de difficulté.
- [x] Prélever des frais d'autorisation et des frais réduits en cas de renouvellement.
- [x] Calculer des intérêts mensuels tant que le compte professionnel reste négatif.
- [x] Interdire toute nouvelle utilisation de la ligne après son échéance.
- [x] Ouvrir un délai de régularisation lorsque le découvert est encore utilisé à l'échéance.
- [x] Majorer le taux pendant la régularisation puis la mise en demeure.
- [x] Ajouter des frais de recouvrement et d'incident lors de la mise en demeure.
- [x] Transmettre au module Juridique un découvert non régularisé après la mise en demeure.
- [x] Convertir le solde négatif bancaire en créance contentieuse sans faire payer deux fois le même principal.
- [x] Bloquer la clôture ou le changement de banque tant que le découvert ou son contentieux reste actif.
- [x] Permettre au module Juridique de distinguer les dossiers fiscaux, administratifs et bancaires par origine.
- [ ] Valider en jeu la chaîne complète : autorisation -> utilisation -> échéance -> régularisation -> mise en demeure -> contentieux.
- [ ] Valider en jeu qu'un retour à solde positif pendant le délai stoppe l'escalade judiciaire.
'''

          guard = '''### Garde-fou de régularisation du découvert

- [x] Une autorisation en délai de régularisation, mise en demeure ou contentieux ne peut pas être renouvelée ou remplacée par une nouvelle autorisation pour remettre artificiellement le dossier à zéro.
- [x] Le bouton de gestion du découvert devient non actionnable pendant ces états de recouvrement.
- [x] Le schéma Banque passe à 8 et le schéma Juridique à 3 pour tracer les nouveaux champs persistants et l'origine des dossiers contentieux.
- [x] Échap > Assistance > Banque et conseiller explique la durée, les frais, le délai de régularisation, la mise en demeure et le passage au contentieux.
- [x] Le guide textuel de démarrage et Échap > Assistance décrivent tous les deux le découvert temporaire et son escalade de recouvrement.
- [x] Les plans de paiement, contestations et règlements Juridiques peuvent cibler un dossier précis lorsque plusieurs dettes coexistent.
- [x] Un contentieux bancaire et un contentieux fiscal restent séparés jusque dans les plans de paiement et les restrictions Administration.
- [x] Le passage du découvert au contentieux est un reclassement de dette : il ne crée ni revenu artificiel ni double charge dans la comptabilité AgriLife.
'''

          for path in ('ROADMAP.md', 'docs/ROADMAP.md'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if '**Préparation F03 0.9.3.24 :**' not in text:
                  marker = '# 3 - Module Banque\n'
                  if marker not in text:
                      raise SystemExit(f'Marker Banque absent dans {path}')
                  text = text.replace(marker, marker + '\n' + prep + '\n', 1)
              if '## Découvert professionnel temporaire et recouvrement' not in text:
                  marker = '## Comptes & finances de base'
                  if marker not in text:
                      raise SystemExit(f'Marker comptes absent dans {path}')
                  text = text.replace(marker, overdraft + '\n' + marker, 1)
              if '### Garde-fou de régularisation du découvert' not in text:
                  text = text.rstrip() + '\n\n' + guard + '\n'
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit roadmap
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add ROADMAP.md docs/ROADMAP.md
          git diff --cached --quiet || git commit -m "Document temporary overdraft recovery"
          git push origin HEAD:main
