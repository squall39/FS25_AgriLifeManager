name: Apply AgriLife 0.9.3 exact text source sync

on:
  push:
    branches: [main]
    paths:
      - tools/sync093_text_ready.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand exact 0.9.3 text sources
        run: python3 tools/apply_093_text_sync.py

      - name: Run static gates
        run: |
          python3 tools/verify_release.py
          python3 tools/audit_l10n_usage.py
          python3 tools/audit_publication.py
          python3 tools/audit_roadmap_writing_completion.py
          python3 tools/audit_workshop81_closure.py
          python3 tools/audit_093_systems.py

      - name: Remove one-shot transfer helpers
        run: |
          rm -rf tools/sync093_text_payload
          rm -f tools/sync093_text_ready.txt
          rm -f tools/apply_093_text_sync.py
          rm -f .github/workflows/apply-093-text-sync.yml

      - name: Commit synchronized 0.9.3 text sources
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Synchronize AgriLife 0.9.3.0 TEST text sources"
          git push origin HEAD:main
