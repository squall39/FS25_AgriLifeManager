name: Apply AgriLife 0.9.3.1 HomeFrame bundle
on:
  push:
    branches: [ main ]
    paths:
      - '.github/sync/0931-homeframe/READY'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrective HomeFrame bundle
        run: python tools/apply_0931_homeframe.py
      - name: Validate extracted files
        run: |
          test -f src/ui/AgriLifeHomeFrame.lua
          test -f gui/AgriLifeHomeFrame.xml
          grep -q 'MODE :' src/ui/AgriLifeHomeFrame.lua || true
      - name: Commit HomeFrame source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Synchronize 0.9.3.1 F02 HomeFrame corrective source'
            git push origin HEAD:main
          fi
