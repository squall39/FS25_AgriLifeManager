name: Sync XP 0.9.3.26

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-xp-09326.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply XP documentation and version sync
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('modDesc.xml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<version>0.9.3.25</version>', '<version>0.9.3.26</version>', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 0.9.3.26 TEST'
          if marker not in text:
              entry = '''## 0.9.3.26 TEST\n\n- Corrige la progression des étoiles de spécialité : 1 étoile tous les 1 000 XP, jusqu'à 10 étoiles.\n- Corrige le HUD mini-PDA pour ne plus mélanger XP total et progression du palier courant.\n- L'XP total est affiché séparément de la progression dans la tranche de 1 000 XP en cours.\n- Exemple de référence : 3 036 XP = 3 étoiles, 36 / 1 000 XP et environ 4 % vers le palier suivant.\n- F03 Banque reste active.\n\n'''
              if text.startswith('# Changelog AgriLife Manager\n\n'):
                  text = '# Changelog AgriLife Manager\n\n' + entry + text[len('# Changelog AgriLife Manager\n\n'):]
              else:
                  text = entry + text
              p.write_text(text, encoding='utf-8')

          p = Path('TESTING.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Version de référence : **0.9.3.24 TEST**', 'Version de référence : **0.9.3.26 TEST**', 1)
          text = text.replace('Version de référence : **0.9.3.25 TEST**', 'Version de référence : **0.9.3.26 TEST**', 1)
          marker = 'Correction XP 0.9.3.26 à revalider'
          if marker not in text:
              text = text.rstrip() + '''\n\nCorrection XP 0.9.3.26 à revalider avant reprise du test bancaire suivant :\n1. Effectuer une activité qui affiche le HUD XP sur le mini-PDA.\n2. Vérifier qu'à 3 036 XP une spécialité affiche 3 étoiles.\n3. Vérifier que l'XP total est affiché séparément.\n4. Vérifier que le palier affiche 36 / 1 000 XP et environ 4 %, et non 3 036 / 7 500 XP avec 1 %.\n5. Envoyer une capture du HUD XP et le log.\n\nF03 Banque reste active mais le prochain mouvement bancaire attend la validation de cette correction XP.\n'''
          p.write_text(text, encoding='utf-8')

          section = '''## Correction XP 0.9.3.26 - cohérence étoiles et mini-PDA\n\n- La progression des spécialités utilise une règle uniforme : 1 étoile tous les 1 000 XP.\n- Chaque spécialité conserve un maximum de 10 étoiles.\n- Le mini-PDA ne mélange plus l'XP total avec le pourcentage du palier en cours.\n- L'XP total est affiché séparément.\n- La ligne de progression affiche uniquement l'avancement depuis la dernière étoile jusqu'à la suivante.\n- Exemple de référence : 3 036 XP correspond à 3 étoiles et 36 / 1 000 XP, soit environ 4 % vers l'étoile suivante.\n- Cette correction ne rouvre pas F01/F02 déjà validées.\n'''
          for path in ('ROADMAP.md', 'docs/ROADMAP.md'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if '## Correction XP 0.9.3.26 - cohérence étoiles et mini-PDA' not in text:
                  p.write_text(text.rstrip() + '\n\n' + section, encoding='utf-8')
          PY
      - name: Commit synchronized files
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add modDesc.xml CHANGELOG.md TESTING.md ROADMAP.md docs/ROADMAP.md
          git diff --cached --quiet || git commit -m "Synchronize XP consistency 0.9.3.26"
          git push origin HEAD:main
