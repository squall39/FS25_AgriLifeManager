name: Sync version 0.9.3.24

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-version-09324.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'modDesc.xml': ('<version>0.9.3.23</version>', '<version>0.9.3.24</version>'),
              'src/core/AgriLifeVersion.lua': ('MOD = "0.9.3.23"', 'MOD = "0.9.3.24"'),
          }
          for path, (old, new) in changes.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected old version missing in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit version
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add modDesc.xml src/core/AgriLifeVersion.lua
          git diff --cached --quiet || git commit -m "Set version 0.9.3.24"
          git push origin HEAD:main
