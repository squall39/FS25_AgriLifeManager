name: Sync validated 0.9.3.23 core

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-09323-core.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source state
        run: |
          python3 tools/run_sync_09323_core.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('modDesc.xml'); ET.parse('gui/AgriLifeHomeFrame.xml')"
      - name: Save synchronized files
        run: |
          git config user.name "squall39"
          git config user.email "38831480+squall39@users.noreply.github.com"
          git add modDesc.xml src/core/AgriLifeVersion.lua gui/AgriLifeHomeFrame.xml src/ui/AgriLifeHomeFrame.lua src/ui/AgriLifeInterface6.lua src/ui/F02Clarity0920.lua ROADMAP.md docs/ROADMAP.md
          git diff --cached --quiet || git commit -m "Synchronize validated 0.9.3.23 source"
          git push origin HEAD:main
